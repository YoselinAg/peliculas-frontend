<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('peliculas', 'Películas', ~{::section})}">
<section class="container">
    <header class="hero">
        <div>
            <h1>Películas</h1>
            <p>Explora el catálogo por título, género o actor.</p>
        </div>
        <a class="button button-accent button-new-actor" th:href="@{/peliculas/nueva}"><span aria-hidden="true">+</span> Nueva película</a>
    </header>

    <p class="notice" th:if="${aviso}" role="status" th:text="${aviso}"></p>

    <form class="filters movie-filters" th:action="@{/peliculas}" method="get" aria-label="Buscar películas">
        <div class="field">
            <label for="titulo">Título</label>
            <input type="search" id="titulo" name="titulo" th:value="${titulo}" placeholder="Ej. Una nueva esperanza">
        </div>
        <div class="field">
            <label for="genero">Género</label>
            <input type="search" id="genero" name="genero" th:value="${genero}" placeholder="Ej. Ciencia ficción">
        </div>
        <div class="field">
            <label for="actor">Actor</label>
            <input type="search" id="actor" name="actor" th:value="${actor}" placeholder="Ej. Carrie Fisher">
        </div>
        <div class="actions">
            <button class="button button-primary" type="submit">Buscar</button>
            <a class="button button-quiet" th:if="${filtrado}" th:href="@{/peliculas}">Limpiar</a>
        </div>
    </form>

    <div class="results-heading">
        <h2 th:text="${filtrado ? 'Resultados de búsqueda' : 'Catálogo'}">Catálogo</h2>
        <span class="count" th:text="${totalPeliculas == 1 ? '1 película' : totalPeliculas + ' películas'}"></span>
    </div>

    <ul class="movie-grid" role="list" th:unless="${peliculas.isEmpty()}">
        <li class="movie-card" th:each="pelicula : ${peliculas}" th:with="portada=${pelicula.urlPortada()}">
            <div class="movie-poster">
                <img th:if="${portada}" th:src="${portada}" alt="" loading="lazy" referrerpolicy="no-referrer">
                <span th:unless="${portada}">Sin portada</span>
            </div>
            <div class="movie-info">
                <h3><a class="movie-title" th:href="@{/peliculas/{id}(id=${pelicula.id})}" th:text="${pelicula.titulo}"></a></h3>
                <p class="muted" th:text="|${pelicula.anio} · ${pelicula.duracion} min|"></p>
                <p class="movie-director" th:text="${pelicula.director}"></p>
                <p class="movie-genre" th:text="${pelicula.genero}"></p>
                <div class="row-actions">
                    <a class="row-action" th:href="@{/peliculas/{id}/editar(id=${pelicula.id})}" th:aria-label="|Editar ${pelicula.titulo}|">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6 4 4M4 20l4-.8 12-12a1.4 1.4 0 0 0 0-2l-2-2a1.4 1.4 0 0 0-2 0l-12 12L4 20Z"/></svg>
                        Editar
                    </a>
                    <a class="row-action row-action-delete" th:href="@{/peliculas/{id}/eliminar(id=${pelicula.id})}" th:aria-label="|Eliminar ${pelicula.titulo}|">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13m-8 4v5m4-5v5"/></svg>
                        Eliminar
                    </a>
                </div>
            </div>
        </li>
    </ul>

    <nav class="pagination" th:if="${paginas > 1}" aria-label="Paginación de películas">
        <span class="count" th:text="|Página ${pagina} de ${paginas}|"></span>
        <div class="actions">
            <a class="button button-quiet" th:if="${pagina > 1}"
               th:href="@{/peliculas(pagina=${pagina - 1},titulo=${titulo},genero=${genero},actor=${actor})}">Anterior</a>
            <a class="button button-quiet" th:if="${pagina < paginas}"
               th:href="@{/peliculas(pagina=${pagina + 1},titulo=${titulo},genero=${genero},actor=${actor})}">Siguiente</a>
        </div>
    </nav>

    <div class="empty" th:if="${peliculas.isEmpty()}">
        <h3 th:text="${filtrado ? 'No hay coincidencias' : 'El catálogo está vacío'}"></h3>
        <p th:if="${filtrado}">Prueba con otro título, género o actor.</p>
        <a class="button button-quiet" th:if="${filtrado}" th:href="@{/peliculas}">Ver todas</a>
        <a class="button button-primary button-new-actor" th:unless="${filtrado}" th:href="@{/peliculas/nueva}">Nueva película</a>
    </div>
</section>
</html>
