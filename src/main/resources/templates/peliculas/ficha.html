<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('peliculas', ${pelicula.titulo}, ~{::section})}">
<section class="container narrow">
    <a class="actor-editor-back" th:href="@{/peliculas}"><span aria-hidden="true">←</span> Volver a películas</a>
    <article class="actor-editor-card">
        <header class="actor-editor-header movie-detail-header" th:with="portada=${pelicula.urlPortada()}">
            <div class="movie-poster">
                <img th:if="${portada}" th:src="${portada}" alt="" referrerpolicy="no-referrer">
                <span th:unless="${portada}">Sin portada</span>
            </div>
            <div>
                <h1 th:text="${pelicula.titulo}"></h1>
                <p th:text="|${pelicula.anio} · ${pelicula.duracion} min · ${pelicula.genero}|"></p>
            </div>
        </header>
        <div class="editor">
            <dl class="movie-details">
                <div><dt>Dirección</dt><dd th:text="${pelicula.director}"></dd></div>
                <div><dt>País</dt><dd th:text="${pelicula.pais}"></dd></div>
            </dl>
            <div class="movie-story" th:unless="${#strings.isEmpty(pelicula.sinopsis)}">
                <h2>Sinopsis</h2>
                <p class="movie-synopsis" th:text="${pelicula.sinopsis}"></p>
            </div>
            <div class="movie-cast">
                <h2>Reparto</h2>
                <p class="muted" th:if="${pelicula.actores.isEmpty()}">Sin actores asociados.</p>
                <ul th:unless="${pelicula.actores.isEmpty()}" class="cast-list" role="list">
                    <li th:each="actor : ${pelicula.actores}">
                        <span class="monogram" aria-hidden="true" th:text="${actor.iniciales()}"></span>
                        <span th:text="${actor.nombre}"></span>
                    </li>
                </ul>
            </div>
            <div class="actions editor-actions">
                <a class="row-action" th:href="@{/peliculas/{id}/editar(id=${pelicula.id})}">Editar</a>
                <a class="row-action row-action-delete" th:href="@{/peliculas/{id}/eliminar(id=${pelicula.id})}">Eliminar</a>
            </div>
        </div>
    </article>
</section>
</html>
