<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('actores', 'Actores', ~{::section})}">
<section class="container">
    <header class="hero">
        <div>
            <h1>Actores</h1>
            <p>Busca y gestiona las fichas del reparto.</p>
        </div>
        <a class="button button-accent button-new-actor" th:href="@{/actores/nuevo}"><span aria-hidden="true">+</span> Nuevo actor</a>
    </header>

    <p class="notice" th:if="${aviso}" role="status" th:text="${aviso}"></p>

    <form class="filters" th:action="@{/actores}" method="get" aria-label="Buscar actores">
        <input type="hidden" name="orden" th:value="${orden}">
        <input type="hidden" name="direccion" th:value="${direccion}">
        <div class="field">
            <label for="nombre">Nombre</label>
            <input type="search" id="nombre" name="nombre" th:value="${nombre}" placeholder="Ej. Carrie Fisher">
        </div>
        <div class="field">
            <label for="paisNacimiento">País de nacimiento</label>
            <input type="search" id="paisNacimiento" name="paisNacimiento" th:value="${paisNacimiento}" placeholder="Ej. Estados Unidos">
        </div>
        <div class="actions">
            <button class="button button-primary" type="submit">Buscar</button>
            <a class="button button-quiet" th:if="${filtrado}" th:href="@{/actores}">Limpiar</a>
        </div>
    </form>

    <div class="results-heading">
        <h2 th:text="${filtrado ? 'Resultados de búsqueda' : 'Directorio'}">Directorio</h2>
        <span class="count" th:text="${totalActores == 1 ? '1 actor' : totalActores + ' actores'}"></span>
    </div>

    <div class="table-wrap" th:unless="${actores.isEmpty()}">
        <table aria-label="Fichas de actores">
            <thead>
            <tr>
                <th scope="col"
                    th:each="columna : ${ {nombre: 'Nombre', fechaNacimiento: 'Fecha de nacimiento', paisNacimiento: 'País de nacimiento'}.entrySet() }"
                    th:with="activa=${orden == columna.key}, siguiente=${activa and direccion == 'asc' ? 'desc' : 'asc'}"
                    th:attr="aria-sort=${activa ? (direccion == 'asc' ? 'ascending' : 'descending') : null}">
                    <a class="sort-link"
                       th:href="@{/actores(nombre=${nombre},paisNacimiento=${paisNacimiento},orden=${columna.key},direccion=${siguiente})}"
                       th:aria-label="|Ordenar por ${columna.value} en orden ${siguiente == 'asc' ? 'ascendente' : 'descendente'}|">
                        <span th:text="${columna.value}"></span>
                        <span class="sort-indicator" aria-hidden="true"
                              th:text="${activa ? (direccion == 'asc' ? '↑' : '↓') : '↕'}"></span>
                    </a>
                </th>
                <th scope="col" class="actions-heading">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="actor : ${actores}">
                <th scope="row">
                    <span class="identity">
                        <span class="monogram" aria-hidden="true" th:text="${actor.iniciales()}"></span>
                        <span th:text="${actor.nombre}"></span>
                    </span>
                </th>
                <td><time th:attr="datetime=${actor.fechaNacimiento}" th:text="${actor.fechaVisible()}"></time></td>
                <td th:text="${actor.paisNacimiento}"></td>
                <td>
                    <div class="row-actions">
                        <a class="row-action" th:href="@{/actores/{id}/editar(id=${actor.id})}" th:aria-label="|Editar a ${actor.nombre}|">
                            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6 4 4M4 20l4-.8 12-12a1.4 1.4 0 0 0 0-2l-2-2a1.4 1.4 0 0 0-2 0l-12 12L4 20Z"/></svg>
                            Editar
                        </a>
                        <a class="row-action row-action-delete" th:href="@{/actores/{id}/eliminar(id=${actor.id})}" th:aria-label="|Eliminar a ${actor.nombre}|">
                            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13m-8 4v5m4-5v5"/></svg>
                            Eliminar
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination" th:if="${paginas > 1}" aria-label="Paginación de actores">
        <span class="count" th:text="|Página ${pagina} de ${paginas}|"></span>
        <div class="actions">
            <a class="button button-quiet" th:if="${pagina > 1}"
               th:href="@{/actores(pagina=${pagina - 1},nombre=${nombre},paisNacimiento=${paisNacimiento},orden=${orden},direccion=${direccion})}">Anterior</a>
            <a class="button button-quiet" th:if="${pagina < paginas}"
               th:href="@{/actores(pagina=${pagina + 1},nombre=${nombre},paisNacimiento=${paisNacimiento},orden=${orden},direccion=${direccion})}">Siguiente</a>
        </div>
    </nav>

    <div class="empty" th:if="${actores.isEmpty()}">
        <h3 th:text="${filtrado ? 'No hay coincidencias' : 'El directorio está vacío'}"></h3>
        <p th:text="${filtrado ? 'Prueba con otro nombre o país de nacimiento.' : 'Añade la primera ficha de actor al catálogo.'}"></p>
        <a class="button button-quiet" th:if="${filtrado}" th:href="@{/actores}">Ver todos</a>
        <a class="button button-primary button-new-actor" th:unless="${filtrado}" th:href="@{/actores/nuevo}">Nuevo actor</a>
    </div>
</section>
</html>
