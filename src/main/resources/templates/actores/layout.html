<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, contenido)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · Cineva|">Cineva</title>
    <link rel="stylesheet" th:href="@{/css/catalogo.css}">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<aside class="rail">
    <a class="brand" th:href="@{/actores}">
        <span class="brand-mark" aria-hidden="true">CV</span>
        <span>Cineva</span>
    </a>
    <nav aria-label="Catálogo">
        <a class="nav-item" th:href="@{/actores}">Actores</a>
    </nav>
</aside>
<main id="contenido" class="main">
    <div class="container" th:replace="${contenido}"></div>
</main>
</body>
</html>
